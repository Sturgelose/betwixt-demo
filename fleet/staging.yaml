# The profile staging and its clusters.
#
# This profile is the second stage of the pipeline. Its cluster pi-staging
# runs on the same Raspberry Pi as lab. It is a sharing cluster with the prefix
# stg. Its applications get the namespaces stg-<namespace> and the Argo CD
# names stg.<application>.

apiVersion: betwixt.dev/v1alpha1
kind: Profile
name: staging
description: A sample staging profile.
attributes:
  domain: stg.sturgelose.com
---
# A sharing cluster sets no facts. It uses the facts of pi.
apiVersion: betwixt.dev/v1alpha1
kind: Cluster
name: pi-staging
profile: staging
shares: pi
prefix: stg
description: The staging stage on the Raspberry Pi of the lab, next to pi.
